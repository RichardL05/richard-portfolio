spring.application.name=richard-portfolio
server.port=8080
app.version=${APP_VERSION:1.0.0}

# Richard's profile. Optional contacts are hidden until supplied.
profile.name=Richard
profile.title=DevOps Engineer
profile.experience=2 years
profile.bio=I am a DevOps Engineer with 2 years of experience. My hands-on work includes AWS EC2, Linux, Docker and Jenkins, with Kubernetes as the next step in my deployment workflow.
profile.email=${PROFILE_EMAIL:}
profile.phone=${PROFILE_PHONE:}
profile.linkedin=${PROFILE_LINKEDIN:}
profile.github=${PROFILE_GITHUB:}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
